[package]
name = "pingolo"
version = "0.1.0"
edition = "2024"
publish = false
description = "Live ping graphs using Kitty pixel graphics"
authors = ["Davide Bertola"]
license = "MIT"
repository = "https://github.com/davibe/pingolo"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
flate2 = "1"
futures-util = "0.3"
tiny-skia = "0.12"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "signal"] }

[profile.release]
lto = "thin"
